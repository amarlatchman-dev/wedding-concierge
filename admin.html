<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wedding Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  body { font-size: 14px; }
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0; height: 100vh; }
  .side h2 { font-size: 22px; padding: 0 10px 14px; }
  .side a { display: block; padding: 9px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; margin-bottom: 2px; }
  .side a.on { background: var(--green-soft); color: var(--green); font-weight: 600; }
  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 20; }
  .content { padding: 24px; max-width: 1200px; }
  .dirty { color: var(--gold); font-weight: 600; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  label.f > input, label.f > select, label.f > textarea { margin-top: 4px; font-weight: 400; }
  .editor { display: grid; grid-template-columns: 1fr 320px; gap: 16px; height: calc(100vh - 150px); min-height: 480px; }
  .editor .mapbox { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); position: relative; }
  .editor .panel { overflow-y: auto; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .edge { stroke: #1a73e8; stroke-linecap: round; opacity: .8; cursor: pointer; }
  .edge-walk { stroke: #2f9e5b; } .edge-vehicle { stroke: #7a4fd6; } .edge-restricted { stroke: #b3261e; stroke-dasharray: 3 3; }
  .edge.sel { stroke: #f2a900; opacity: 1; }
  .node circle { fill: #fff; stroke: #1f2a24; stroke-width: 2; cursor: move; }
  .node.sel circle { fill: #f2a900; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 100; padding: 16px; }
  .modal > .card { max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 200; font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; font-size: 12px; }
  .legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; display: flex; overflow-x: auto; padding: 8px; gap: 4px; }
    .side h2 { display: none; }
    .side a { white-space: nowrap; }
    .editor { grid-template-columns: 1fr; height: auto; }
    .editor .mapbox { height: 60vh; }
    .content { padding: 16px; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app"><div class="wrap" style="max-width:380px;padding-top:12vh">
  <div class="card stack">
    <h1>Wedding Admin</h1>
    <p class="muted">Enter the admin password.</p>
    <form id="login" class="stack"><input type="password" id="pw" autocomplete="current-password" placeholder="Password" required><button class="btn btn-primary btn-block">Sign in</button><p id="loginErr" class="changed"></p></form>
  </div></div></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
